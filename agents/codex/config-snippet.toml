# Codex agent roles — generated by scripts/build-codex-agents.js from agents/<role>.md
# Do not edit by hand; edit the source and re-run the script.
#
# Codex has no per-plugin agents: a role is a TOML config layer that a project (or the
# user config) registers. Append this block to the project's .codex/config.toml (or
# ~/.codex/config.toml), replacing <PLUGIN_ROOT> with the absolute install path the
# SessionStart hook prints. The project-onboarding skill does this.

[agents]
enabled = true

[agents.developer]
config_file = "<PLUGIN_ROOT>/agents/codex/developer.toml"
description = "Developer: spec review for implementability, technical research against official docs, writing code and prototypes per an approved spec. Lean by default, root-cause fixes, evidence with every \"done\"."

[agents.tester]
config_file = "<PLUGIN_ROOT>/agents/codex/tester.toml"
description = "Tester: spec review for testability, verification by actually running code and tests, test strategy. Writes the evidence file the auditor reads. Not run = not verified."

[agents.critic]
config_file = "<PLUGIN_ROOT>/agents/codex/critic.toml"
description = "Critic: adversarial review of a spec, architecture doc, plan or research before the user sees it — unproven assumptions, silent forks, unsourced claims, excess complexity, where it breaks. Findings, never a verdict; never edits the artifact."

[agents.auditor]
config_file = "<PLUGIN_ROOT>/agents/codex/auditor.toml"
description = "Auditor: blind audit of a finished change against its contract, given only the change package, the contract and the tester evidence. Never reads plans, journals or git history. Findings, never a verdict; no edits, no execution."

[agents.researcher]
config_file = "<PLUGIN_ROOT>/agents/codex/researcher.toml"
description = "Researcher: read-only digest of facts a task needs, each with its source — where code lives, the execution path, similar code, nearby tests, contracts that must not break, relevant project docs/ and official documentation of the locked version; conflicts and gaps. Never edits."

[agents.debugger]
config_file = "<PLUGIN_ROOT>/agents/codex/debugger.toml"
description = "Debugger: root cause of a failure by reproduction and one-at-a-time hypotheses; returns evidence and a minimal fix proposal. Runs tests, never edits."
